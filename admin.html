<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a2b"><title>粒安智链｜管理后台</title><style>
:root{--g:#173a2b;--cream:#f6f0e4;--paper:#fffdf8;--gold:#ad8d4c;--ink:#202821;--muted:#6f7770;--line:#e3dccb;--ok:#2f7452}*{box-sizing:border-box}body{margin:0;background:#f5f1e8;color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}.top{background:var(--g);color:#fff;padding:16px 24px;position:sticky;top:0;z-index:10}.topin{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.12em}.sub{font-size:12px;color:#d9e1dc}.page{max-width:1280px;margin:22px auto;padding:0 18px 50px}.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px}h1,h2,h3{color:var(--g);margin:0 0 14px}label{display:block;font-size:12px;color:var(--muted);margin:11px 0 6px}input,textarea{width:100%;border:1px solid #d8d2c5;border-radius:12px;padding:10px 12px;background:white;color:var(--ink)}textarea{min-height:82px;resize:vertical}button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer}.primary{background:var(--g);color:#fff}.ghost{background:#f1ede4;color:var(--g);border:1px solid var(--line)}.row{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:12px;padding:8px 10px;border-radius:10px;background:#eef5f0;color:var(--ok);margin-top:10px}.hidden{display:none!important}.batchList{display:grid;gap:8px;margin-top:12px}.batchBtn{text-align:left;background:#f7f3ea;border:1px solid var(--line)}.batchBtn.active{background:#e9f0eb;border-color:#b9cfc1}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}.step{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.stepNo{font-size:11px;color:var(--gold);font-weight:800}.preview{margin-top:10px;aspect-ratio:4/3;border-radius:12px;border:1px dashed #cfc7b6;background:#f6f2e9;display:grid;place-items:center;overflow:hidden;color:#8b908c;font-size:12px;text-align:center}.preview img{width:100%;height:100%;object-fit:cover}.small{font-size:12px;color:var(--muted)}.publish{margin-top:18px;padding:16px;background:#173a2b;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.publish button{background:#d7bd7c;color:#10271d;font-weight:800}.login{max-width:460px;margin:60px auto}.notice{font-size:12px;color:var(--muted);line-height:1.7}.link{word-break:break-all;font-size:12px;color:#25513d;background:#f4f0e7;padding:10px;border-radius:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.steps,.formgrid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">粒安智链 · 管理后台</div><div class="sub">批次数据 · 产业图片 · 发布管理</div></div><button id="logoutBtn" class="ghost hidden">退出登录</button></div></header>
<div id="loginView" class="page login"><div class="card"><h1>管理员登录</h1><p class="notice">第一次使用可先注册管理员账号。如果 Supabase 要求邮箱确认，请到邮箱完成确认后再登录。</p><label>邮箱</label><input id="email" type="email"><label>密码</label><input id="password" type="password"><div class="row" style="margin-top:14px"><button id="loginBtn" class="primary">登录</button><button id="signupBtn" class="ghost">首次注册</button></div><div id="authStatus" class="status">尚未登录</div></div></div>
<div id="adminView" class="page hidden"><div class="grid"><aside class="card"><h2>批次管理</h2><button id="newBatchBtn" class="primary" style="width:100%">＋ 新建批次</button><div id="batchList" class="batchList"></div></aside><main>
<section class="card"><h2>产品身份</h2><div class="formgrid"><div><label>批次号</label><input id="batch_code"></div><div><label>产品名称</label><input id="product_name"></div><div><label>产地</label><input id="origin"></div><div><label>品种</label><input id="variety"></div><div><label>采收日期</label><input id="harvest_date" type="date"></div><div><label>加工日期</label><input id="process_date" type="date"></div><div><label>包装规格</label><input id="package_spec"></div><div><label>检验报告编号</label><input id="inspection_no"></div></div><label>检测摘要</label><textarea id="inspection_summary"></textarea><div class="row" style="margin-top:14px"><button id="saveBatchBtn" class="primary">保存批次信息</button></div><div id="saveStatus" class="status">等待操作</div></section>
<section class="card" style="margin-top:18px"><h2>六个生产环节 · 图片上传</h2><p class="small">上传图片并保存环节；发布批次后，评委手机微信扫码即可读取最新云端图片。</p><div id="steps" class="steps"></div></section>
<section class="publish"><div><strong>消费者端发布</strong><div class="small" style="color:#dce5df">发布后，扫码端自动读取当前批次。</div></div><button id="publishBtn">发布本批次</button></section><div class="card" style="margin-top:18px"><h3>买家端链接</h3><div id="buyerLink" class="link">请先选择批次</div></div>
</main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient('https://jgoluzlxhzikrkxammje.supabase.co','sb_publishable_F8SQl1U_G-jdDDW6mAw27w_rTxYlDK4');
const STEP_DEFS=[['origin','基地种植'],['harvest','机械化收获'],['cleaning_sorting','清洗与分选'],['drying','热泵干燥'],['storage','储藏管理'],['packaging','包装建档']];let currentBatch=null,currentSteps={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function setUI(session){$('loginView').classList.toggle('hidden',!!session);$('adminView').classList.toggle('hidden',!session);$('logoutBtn').classList.toggle('hidden',!session);if(session)await loadBatches()}db.auth.getSession().then(({data})=>setUI(data.session));db.auth.onAuthStateChange((_e,s)=>setUI(s));
$('loginBtn').addEventListener('click',async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?'登录失败：'+error.message:'登录成功'});$('signupBtn').addEventListener('click',async()=>{const {data,error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value});$('authStatus').textContent=error?'注册失败：'+error.message:(data.session?'注册并登录成功':'注册成功，请检查邮箱确认')});$('logoutBtn').addEventListener('click',()=>db.auth.signOut());
async function loadBatches(){const {data,error}=await db.from('batches').select('*').order('created_at',{ascending:false});if(error)return $('saveStatus').textContent='读取失败：'+error.message;const list=$('batchList');list.innerHTML='';(data||[]).forEach(b=>{const btn=document.createElement('button');btn.className='batchBtn'+(currentBatch?.id===b.id?' active':'');btn.innerHTML=`<strong>${esc(b.batch_code)}</strong><div class="small">${b.published?'已发布':'草稿'} · ${esc(b.product_name)}</div>`;btn.addEventListener('click',()=>selectBatch(b));list.appendChild(btn)});if(!currentBatch&&data?.length)selectBatch(data[0])}
async function selectBatch(b){currentBatch=b;['batch_code','product_name','origin','variety','harvest_date','process_date','package_spec','inspection_no','inspection_summary'].forEach(k=>$(k).value=b[k]||'');const {data}=await db.from('trace_steps').select('*').eq('batch_id',b.id).order('sort_order');currentSteps={};(data||[]).forEach(s=>currentSteps[s.step_key]=s);renderSteps();updateBuyerLink();$('publishBtn').textContent=b.published?'重新发布更新':'发布本批次';$('saveStatus').textContent='已加载 '+b.batch_code}
function renderSteps(){const box=$('steps');box.innerHTML='';STEP_DEFS.forEach(([key,title],i)=>{const s=currentSteps[key]||{};const c=document.createElement('div');c.className='step';c.innerHTML=`<span class="stepNo">STEP ${String(i+1).padStart(2,'0')}</span><h3>${title}</h3><div class="preview" id="prev_${key}">${s.image_url?`<img src="${esc(s.image_url)}">`:'暂无图片<br>从电脑选择真实产业图'}</div><label>上传图片</label><input id="file_${key}" type="file" accept="image/*"><label>环节说明</label><textarea id="desc_${key}">${esc(s.description||'')}</textarea><button id="save_${key}" class="primary" style="margin-top:10px">保存该环节</button><div class="small" id="status_${key}" style="margin-top:8px"></div>`;box.appendChild(c);$('file_'+key).addEventListener('change',()=>{const f=$('file_'+key).files[0];if(f)$('prev_'+key).innerHTML=`<img src="${URL.createObjectURL(f)}">`});$('save_'+key).addEventListener('click',()=>saveStep(key,title,i+1))})}
async function saveStep(key,title,order){if(!currentBatch)return;const st=$('status_'+key);st.textContent='正在保存…';let image_url=currentSteps[key]?.image_url||null;const f=$('file_'+key).files[0];if(f){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=`${currentBatch.batch_code}/${key}/${Date.now()}_${safe}`;const {error}=await db.storage.from('trace-images').upload(path,f,{upsert:true,contentType:f.type||'image/jpeg'});if(error)return st.textContent='上传失败：'+error.message;image_url=db.storage.from('trace-images').getPublicUrl(path).data.publicUrl}const payload={batch_id:currentBatch.id,step_key:key,step_title:title,description:$('desc_'+key).value.trim(),image_url,sort_order:order};const {data,error}=await db.from('trace_steps').upsert(payload,{onConflict:'batch_id,step_key'}).select().single();st.textContent=error?'保存失败：'+error.message:'✓ 已保存到云端';if(!error){currentSteps[key]=data;renderSteps()}}
$('newBatchBtn').addEventListener('click',async()=>{const code=prompt('请输入新批次号，例如 JA-2026-002');if(!code)return;const {data,error}=await db.from('batches').insert({batch_code:code.trim(),product_name:'如皋小花生 · 精品批次',origin:'江苏如皋 · 江安镇',variety:'细荚花生',package_spec:'200 g / 袋',published:false}).select().single();if(error)return alert(error.message);await db.from('trace_steps').insert(STEP_DEFS.map(([k,t],i)=>({batch_id:data.id,step_key:k,step_title:t,description:'',sort_order:i+1})));currentBatch=null;await loadBatches();await selectBatch(data)});
$('saveBatchBtn').addEventListener('click',async()=>{if(!currentBatch)return;const patch={};['batch_code','product_name','origin','variety','harvest_date','process_date','package_spec','inspection_no','inspection_summary'].forEach(k=>patch[k]=$(k).value||null);const {data,error}=await db.from('batches').update(patch).eq('id',currentBatch.id).select().single();$('saveStatus').textContent=error?'保存失败：'+error.message:'✓ 批次信息已保存';if(!error){currentBatch=data;updateBuyerLink();await loadBatches()}});
$('publishBtn').addEventListener('click',async()=>{if(!currentBatch)return;const {data,error}=await db.from('batches').update({published:true}).eq('id',currentBatch.id).select().single();if(error)return alert('发布失败：'+error.message);currentBatch=data;$('saveStatus').textContent='✓ 已发布，评委手机刷新即可看到最新内容';updateBuyerLink();await loadBatches()});function updateBuyerLink(){if(!currentBatch)return;const base=location.href.replace(/admin\.html.*$/,'index.html');$('buyerLink').textContent=`${base}?batch=${encodeURIComponent(currentBatch.batch_code)}`}
</script></body></html>
